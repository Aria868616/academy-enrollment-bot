[project]
name = "pc-bot"
version = "0.1.0"
description = "Telegram bot for course enrollment, built with pyTelegramBotAPI and SQLModel"
readme = "README.md"
authors = [
    { name = "Aria", email = "noreply@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pytelegrambotapi>=4.37.0",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]